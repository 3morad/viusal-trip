<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CHROMA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23E8A33D'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2305060A'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#EDEEF2; --dim:#8C93A1; --line:#262B36; --accent:#E8A33D; --bg:#05060A;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;
  touch-action:none;
}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#gl{z-index:0}
#hands{z-index:1;pointer-events:none}
#cam{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;top:0;left:0}

/* ---------- hud ---------- */
#hud{
  position:fixed;inset:0;z-index:10;pointer-events:none;
  font-family:var(--mono);font-size:.6875rem;letter-spacing:.12em;text-transform:uppercase;
  opacity:1;transition:opacity .5s ease;
  padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
}
#hud.idle{opacity:0}
.hud-tl,.hud-tr,.hud-bl,.hud-br{position:absolute;display:flex;align-items:center;gap:10px;color:#727A89}
.hud-tl{top:18px;left:18px}
.hud-tr{top:18px;right:18px}
.hud-bl{bottom:18px;left:18px}
.hud-br{bottom:18px;right:18px;gap:6px}
#chord{color:var(--ink);font-size:.9375rem;letter-spacing:.06em}
.dot{width:9px;height:9px;border-radius:50%;background:#333;box-shadow:0 0 14px currentColor}
#scenes{display:flex;gap:6px;pointer-events:auto}
.sbtn{
  font:inherit;letter-spacing:.12em;text-transform:uppercase;color:#6C7482;
  background:transparent;border:1px solid transparent;border-radius:999px;
  padding:5px 11px;cursor:pointer;transition:color .2s,border-color .2s;
}
.sbtn:hover{color:var(--ink)}
.sbtn[aria-pressed="true"]{color:#0A0C11;background:var(--ink);border-color:var(--ink)}
.hud-bl{gap:6px}
.tog{
  font:inherit;letter-spacing:.12em;text-transform:uppercase;color:#6C7482;
  background:transparent;border:1px solid transparent;border-radius:999px;
  padding:5px 11px;cursor:pointer;pointer-events:auto;
  transition:color .2s,background .2s,border-color .2s;
}
.tog:hover{color:var(--ink)}
.tog[aria-pressed="true"]{color:#0A0C11;background:var(--ink);border-color:var(--ink)}
.tog[disabled]{opacity:.4;cursor:default}
.tog.busy{color:var(--accent)}
#scenes,.hud-bl{pointer-events:auto}
#notice{
  position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:12;font-family:var(--mono);font-size:.6875rem;letter-spacing:.1em;text-transform:uppercase;
  color:#69707E;background:rgba(5,6,10,.55);border:1px solid var(--line);border-radius:999px;
  padding:8px 16px;pointer-events:none;transition:opacity 1s ease;text-align:center;
}
#notice.gone{opacity:0}
#gstate{color:var(--accent)}
#gstate.off{color:#4C5361}
@media (max-width:640px){ .hud-bl{display:none} }
</style>
</head>
<body>

<canvas id="gl"></canvas>
<canvas id="hands"></canvas>
<video id="cam" playsinline muted></video>

<div id="hud">
  <div class="hud-tl"><span class="dot" id="dot"></span><span id="chord">--</span><span id="bpm"></span></div>
  <div class="hud-tr"><div id="scenes"></div></div>
  <div class="hud-bl">
    <button class="tog" id="tMic"   type="button" aria-pressed="false">mic</button>
    <button class="tog" id="tHands" type="button" aria-pressed="false">hands</button>
    <button class="tog" id="tFile"  type="button" aria-pressed="false">file</button>
  </div>
  <div class="hud-br"><span id="count"></span><span id="hint"></span></div>
</div>

<div id="notice">Flashing light. Brightness is rate limited.</div>

<input type="file" id="file" accept="audio/*" hidden>
<script src="engine.js"></script>
<script src="playground.js"></script>
</body>
</html>
