<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CHROMA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23E8A33D'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2305060A'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#EDEEF2; --dim:#8C93A1; --line:#262B36; --accent:#E8A33D; --bg:#05060A;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;
  touch-action:none;
}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#gl{z-index:0}
#hands{z-index:1;pointer-events:none}
#cam{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;top:0;left:0}

/* ---------- hud ---------- */
#hud{
  position:fixed;inset:0;z-index:10;pointer-events:none;
  font-family:var(--mono);font-size:.6875rem;letter-spacing:.12em;text-transform:uppercase;
  opacity:1;transition:opacity .5s ease;
  padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
}
#hud.idle{opacity:0}
.hud-tl,.hud-tr,.hud-bl,.hud-br{position:absolute;display:flex;align-items:center;gap:10px;color:#727A89}
.hud-tl{top:18px;left:18px}
.hud-tr{top:18px;right:18px}
.hud-bl{bottom:18px;left:18px}
.hud-br{bottom:18px;right:18px;gap:6px}
#chord{color:var(--ink);font-size:.9375rem;letter-spacing:.06em}
.dot{width:9px;height:9px;border-radius:50%;background:#333;box-shadow:0 0 14px currentColor}
.hud-bl{gap:6px}
.tog{
  font:inherit;letter-spacing:.12em;text-transform:uppercase;color:#6C7482;
  background:transparent;border:1px solid transparent;border-radius:999px;
  padding:5px 11px;cursor:pointer;pointer-events:auto;
  transition:color .2s,background .2s,border-color .2s;
}
.tog:hover{color:var(--ink)}
.tog[aria-pressed="true"]{color:#0A0C11;background:var(--ink);border-color:var(--ink)}
.tog[disabled]{opacity:.4;cursor:default}
.tog.busy{color:var(--accent)}
.hud-bl{pointer-events:auto}

/* ---------- tutorial: shows itself, then gets out of the way ---------- */
#tut{
  position:fixed;z-index:13;left:50%;transform:translateX(-50%);
  bottom:max(58px,calc(env(safe-area-inset-bottom) + 54px));
  width:min(430px,calc(100vw - 28px));
  background:rgba(6,8,13,.62);border:1px solid var(--line);border-radius:16px;
  padding:14px 16px;pointer-events:none;
  transition:opacity 1.4s ease,transform 1.4s ease;
}
#tut.gone{opacity:0;transform:translateX(-50%) translateY(10px)}
#tutTop{
  margin:0 0 12px;font-family:var(--mono);font-size:.6875rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);text-align:center;line-height:1.5;
}
#tutTop.done{color:#5E6675}
.tut-rows{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.tut-rows li{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:12px}
.tut-rows svg{
  width:22px;height:22px;stroke:var(--ink);stroke-width:1.5;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:.85;
}
.tut-rows b{font-size:.8125rem;font-weight:550;color:var(--ink);letter-spacing:-.01em}
#tutFoot{
  margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:.5938rem;letter-spacing:.09em;text-transform:uppercase;
  color:#565D6B;text-align:center;
}
.tut-rows span{
  font-family:var(--mono);font-size:.625rem;letter-spacing:.09em;
  text-transform:uppercase;color:#6B7382;text-align:right;
}
@media (max-height:560px){ .tut-rows li:nth-child(n+4){display:none} }
#gstate{color:var(--accent)}
#gstate.off{color:#4C5361}
</style>
</head>
<body>

<canvas id="gl"></canvas>
<canvas id="hands"></canvas>
<video id="cam" playsinline muted></video>

<div id="hud">
  <div class="hud-tl"><span class="dot" id="dot"></span><span id="chord">--</span><span id="bpm"></span></div>
  <div class="hud-bl">
    <button class="tog" id="tMic"   type="button" aria-pressed="false">mic</button>
    <button class="tog" id="tHands" type="button" aria-pressed="false">hands</button>
    <button class="tog" id="tFile"  type="button" aria-pressed="false">file</button>
  </div>
  <div class="hud-br"><span id="count"></span><span id="hint"></span></div>
</div>

<div id="tut">
  <div class="tut-in">
    <p id="tutTop">Tap anywhere to let it hear and see you</p>
    <ul class="tut-rows">
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z"  /> <path d="M8 13v-8.5a1.5 1.5 0 0 1 3 0v7.5" /> <path d="M11 11.5v-2a1.5 1.5 0 0 1 3 0v2.5" /> <path d="M14 10.5a1.5 1.5 0 0 1 3 0v1.5" /> <path d="M17 11.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1 -6 6h-2h.208a6 6 0 0 1 -5.012 -2.7l-.196 -.3c-.312 -.479 -1.407 -2.388 -3.286 -5.728a1.5 1.5 0 0 1 .536 -2.022a1.867 1.867 0 0 1 2.28 .28l1.47 1.47" /> <path d="M5 3l-1 -1" /> <path d="M4 7h-1" /> <path d="M14 3l1 -1" /> <path d="M15 6h1" /></svg><b>Pinch</b><span>drop an orb</span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z"  /> <path d="M8 13v-8.5a1.5 1.5 0 0 1 3 0v7.5" /> <path d="M11 11.5v-2a1.5 1.5 0 1 1 3 0v2.5" /> <path d="M14 10.5a1.5 1.5 0 0 1 3 0v1.5" /> <path d="M17 11.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1 -6 6h-2h.208a6 6 0 0 1 -5.012 -2.7a69.74 69.74 0 0 1 -.196 -.3c-.312 -.479 -1.407 -2.388 -3.286 -5.728a1.5 1.5 0 0 1 .536 -2.022a1.867 1.867 0 0 1 2.28 .28l1.47 1.47" /></svg><b>Point and move</b><span>paint a trail</span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z"  /> <path d="M8 13v-7.5a1.5 1.5 0 0 1 3 0v6.5" /> <path d="M11 5.5v-2a1.5 1.5 0 1 1 3 0v8.5" /> <path d="M14 5.5a1.5 1.5 0 0 1 3 0v6.5" /> <path d="M17 7.5a1.5 1.5 0 0 1 3 0v8.5a6 6 0 0 1 -6 6h-2h.208a6 6 0 0 1 -5.012 -2.7a69.74 69.74 0 0 1 -.196 -.3c-.312 -.479 -1.407 -2.388 -3.286 -5.728a1.5 1.5 0 0 1 .536 -2.022a1.867 1.867 0 0 1 2.28 .28l1.47 1.47" /></svg><b>Open your hand</b><span>push a ring</span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z"  /> <path d="M8 13v-8.5a1.5 1.5 0 0 1 3 0v7.5" /> <path d="M11 11.5v-2a1.5 1.5 0 0 1 3 0v2.5" /> <path d="M14 10.5a1.5 1.5 0 0 1 3 0v1.5" /> <path d="M17 11.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1 -6 6h-2h.208a6 6 0 0 1 -5.012 -2.7l-.196 -.3c-.312 -.479 -1.407 -2.388 -3.286 -5.728a1.5 1.5 0 0 1 .536 -2.022a1.867 1.867 0 0 1 2.28 .28l1.47 1.47" /> <path d="M2.541 5.594a13.487 13.487 0 0 1 2.46 -1.427" /> <path d="M14 3.458c1.32 .354 2.558 .902 3.685 1.612" /></svg><b>Two hands apart</b><span>mirror it all</span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z"  /> <path d="M8 11v-3.5a1.5 1.5 0 0 1 3 0v2.5" /> <path d="M11 9.5v-3a1.5 1.5 0 0 1 3 0v3.5" /> <path d="M14 7.5a1.5 1.5 0 0 1 3 0v2.5" /> <path d="M17 9.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1 -6 6h-2h.208a6 6 0 0 1 -5.012 -2.7l-.196 -.3c-.312 -.479 -1.407 -2.388 -3.286 -5.728a1.5 1.5 0 0 1 .536 -2.022a1.867 1.867 0 0 1 2.28 .28l1.47 1.47" /></svg><b>Hold a fist</b><span>wipe it clean</span></li>
    </ul>
    <p id="tutFoot">Flashing light. Brightness is rate limited.</p>
  </div>
</div>

<input type="file" id="file" accept="audio/*" hidden>
<script src="engine.js"></script>
<script src="playground.js"></script>
</body>
</html>
